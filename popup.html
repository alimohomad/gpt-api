
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.2);
            --text: #ececec;
            --text-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
            --code-bg: #050507;
        }

        body {
            width: 550px;
            min-height: 500px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            border-color: var(--primary);
            background: var(--primary-glow);
            transform: translateY(-1px);
        }

        #url {
            font-size: 11px;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            word-break: break-all;
            border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
        }

        #output {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            max-height: 600px;
            min-height: 350px;
            overflow: auto;
            font-size: 15px;
            line-height: 1.7;
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Markdown Styles */
        #output h1, #output h2, #output h3 { color: var(--primary); margin-top: 24px; margin-bottom: 12px; }
        #output h1 { font-size: 24px; }
        #output h2 { font-size: 20px; }
        #output h3 { font-size: 18px; }
        #output p { margin-bottom: 16px; }
        
        #output code { 
            font-family: 'JetBrains Mono', monospace; 
            background: rgba(255, 255, 255, 0.08); 
            padding: 3px 6px; 
            border-radius: 6px; 
            font-size: 13px;
            color: #ff79c6;
        }

        #output pre {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #output pre code {
            background: transparent;
            padding: 0;
            color: #bd93f9;
            display: block;
            line-height: 1.5;
        }

        #output blockquote {
            border-left: 4px solid var(--primary);
            background: rgba(0, 255, 136, 0.03);
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 12px 12px 0;
            color: #d0d0d0;
            font-style: italic;
        }

        #output ul, #output ol { padding-left: 24px; margin-bottom: 16px; }
        #output li { margin-bottom: 8px; }

        .status {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            padding-top: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.85); }
        }

        #output::-webkit-scrollbar { width: 8px; }
        #output::-webkit-scrollbar-track { background: transparent; }
        #output::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        #output::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .input-area {
            display: flex;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 14px;
            padding: 8px;
            font-family: 'Inter', sans-serif;
        }
        .input-area button {
            background: var(--primary);
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg);
            padding: 0;
            transition: all 0.2s;
        }
        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--primary-glow);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Stream Insight</h2>
        <div class="actions">
            <button id="copyBtn">Copy Text</button>
            <button id="clearBtn">Clear</button>
        </div>
    </div>

    <div id="url">Waiting for stream...</div>

    <div id="output">No stream captured yet.</div>

    <div class="input-area">
        <input type="text" id="popup-input" placeholder="Ask ChatGPT anything..." autocomplete="off" />
        <button id="popup-send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <div class="status">
        <div class="dot"></div>
        <span>Listening for SSE events...</span>
    </div>

    <script src="marked.js"></script>
    <script src="popup.js"></script>
</body>
</html>
